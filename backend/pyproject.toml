[project]
name = "photo-assistant"
version = "0.0.1"
description = "Private, local-first family photo library"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "blake3>=1.0.10",
    "pyvips>=3.2.0",
    "pyexiftool>=0.5.6",
    "argon2-cffi>=25.1.0",
    "reverse-geocoder>=1.5.1",
    "scipy>=1.18.1",  # k-d tree in adapters/geocoder.py
    "imagehash>=4.3.2",
    "zipstream-ng>=1.9.3",
    "pillow>=13.0.0",
    "pycountry>=26.2.16",
    "typst>=0.15.0",
    "httpx>=0.28.1",
    "python-multipart>=0.0.32",
    "onnxruntime>=1.30.0",
    "sqlite-vec~=0.1.9",  # pre-v1, breaking changes announced: stay on 0.1.x (TECH_DECISIONS)
    "tokenizers>=0.23.2",
    "numpy>=2.5.3",
    "opencv-python-headless>=5.0.0.93",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "httpx2",  # Starlette >= 1.x TestClient transport (plain httpx is deprecated there)
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.1",
    "onnx>=1.23.1",
    "pyyaml>=6.0.3",  # tests/deploy reads compose.yml
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/photo_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = ["error"]
markers = [
    "integration: needs external tools (exiftool, libvips)",
    "models: needs the real ML model files (set PA_MODELS_DIR; run on the laptop)",
]

[tool.coverage.run]
source = ["photo_assistant"]
branch = true
omit = ["*/__main__.py"]  # process entrypoint, exercised by the smoke run in CI

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PTH", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.mypy]
python_version = "3.12"
strict = true
# The tests and scripts are checked as strictly as the package: a fake that drifts from its
# port, or a "type: ignore" nothing needs any more (warn_unused_ignores, part of strict), fails.
mypy_path = "src:."
explicit_package_bases = true
files = ["src/photo_assistant", "tests", "scripts"]

[tool.importlinter]
root_package = "photo_assistant"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Hexagonal layers: dependencies point inward"
type = "layers"
layers = [
    "photo_assistant.api",
    "photo_assistant.adapters",
    "photo_assistant.app",
    "photo_assistant.ports",
    "photo_assistant.domain",
]

[[tool.importlinter.contracts]]
name = "Domain stays pure (no frameworks, no I/O libraries)"
type = "forbidden"
source_modules = ["photo_assistant.domain"]
forbidden_modules = [
    "fastapi", "pydantic", "pydantic_settings", "sqlite3", "httpx", "uvicorn", "typst", "pyvips",
    "numpy", "onnxruntime", "cv2", "sqlite_vec", "tokenizers",
]

[[tool.importlinter.contracts]]
name = "Use cases and ports: no frameworks, SQL, subprocesses, imaging or ML libraries"
type = "forbidden"
source_modules = ["photo_assistant.app", "photo_assistant.ports"]
forbidden_modules = [
    "fastapi", "starlette", "pydantic", "pydantic_settings", "uvicorn", "python_multipart",
    "sqlite3", "sqlite_vec", "subprocess", "httpx", "typst", "pyvips", "PIL", "imagehash",
    "exiftool", "blake3", "argon2", "numpy", "scipy", "onnxruntime", "cv2", "tokenizers",
    "reverse_geocoder", "pycountry", "zipstream",
]
