name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: System tools (exiftool, libvips, HEIC decoder, restic, rclone)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libimage-exiftool-perl libvips42 libvips-tools \
            libheif-plugin-libde265 restic rclone
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Layer contracts
        run: uv run lint-imports
      - name: Types
        run: uv run mypy
      - name: Tests (a test skipped for a missing tool fails here)
        run: uv run pytest --cov
        env:
          PA_REQUIRE_TOOLS: "1"
      - name: "Import smoke test (fixtures, twice: second run must import nothing)"
        run: |
          export PA_DATA_ROOT="$RUNNER_TEMP/pa-import" PA_MIN_FREE_GB=0
          uv run python -m photo_assistant import tests/fixtures/photos | tee first.txt
          uv run python -m photo_assistant import tests/fixtures/photos | tee second.txt
          grep -E "imported +9$" first.txt
          grep -E "imported +0$" second.txt
      - name: Smoke run
        run: |
          PA_DATA_ROOT="$RUNNER_TEMP/pa-data" uv run python -m photo_assistant &
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8420/api/health && exit 0; sleep 0.5; done
          exit 1

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Lint
        run: pnpm lint
      - name: Types
        run: pnpm check
      - name: Tests
        run: pnpm test
      - name: Build
        run: pnpm build

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
