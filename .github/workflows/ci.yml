name: CI

# GitHub's free plan gives a private repository 2,000 runner minutes a month and a run of every
# job bills about 15. So: pull requests only (main gets what its pull request was checked
# with, and a full run each week), never a draft, and a job only when its files changed.
# `just check-report` runs the same checks on the laptop and shows the result on the commit.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "17 3 * * 1"  # Mondays: everything on main, for what pull requests merged together
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read  # the secret scan lists the pull request's commits

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The secret scan, and which of the jobs below this change needs: one short job, not two
  # (each job is billed in whole minutes).
  changes:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    outputs:
      backend: ${{ steps.paths.outputs.backend }}
      web: ${{ steps.paths.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - id: paths
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then  # weekly or by hand: everything
            echo "backend=true" >> "$GITHUB_OUTPUT"; echo "web=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # A pull request is checked out as its merge into main: the first parent is main
          git diff --name-only HEAD^1 HEAD | tee changed.txt
          # The backend tests also read docs/ and deploy/: only a change inside web/ alone skips them
          grep -qv '^web/' changed.txt && echo "backend=true" >> "$GITHUB_OUTPUT"
          # The web tests read docs/contracts/ too
          grep -qE '^(web/|docs/contracts/|\.github/)' changed.txt && echo "web=true" >> "$GITHUB_OUTPUT"
          exit 0

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: System tools (exiftool, libvips, HEIC decoder, restic, rclone)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libimage-exiftool-perl libvips42 libvips-tools \
            libheif-plugin-libde265 restic rclone
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Layer contracts
        run: uv run lint-imports
      - name: Types (the package, its tests and the scripts)
        run: uv run mypy
      - name: Tests (a test skipped for a missing tool fails here)
        run: uv run pytest --cov
        env:
          PA_REQUIRE_TOOLS: "1"
      - name: "Import smoke test (fixtures, twice: second run must import nothing)"
        run: |
          export PA_DATA_ROOT="$RUNNER_TEMP/pa-import" PA_MIN_FREE_GB=0
          uv run python -m photo_assistant import tests/fixtures/photos | tee first.txt
          uv run python -m photo_assistant import tests/fixtures/photos | tee second.txt
          grep -E "imported +9$" first.txt
          grep -E "imported +0$" second.txt
      - name: Smoke run
        run: |
          PA_DATA_ROOT="$RUNNER_TEMP/pa-data" uv run python -m photo_assistant &
          trap 'kill %1' EXIT  # a server left running holds uv's cache lock and fails the cleanup
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8420/api/health && exit 0; sleep 0.5; done
          exit 1

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Lint
        run: pnpm lint
      - name: Types
        run: pnpm check
      - name: Tests
        run: pnpm test
      - name: Build
        run: pnpm build
