repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: ruff
        name: ruff (backend)
        entry: bash -c 'cd backend && uv run ruff check . && uv run ruff format --check .'
        language: system
        files: ^backend/
        pass_filenames: false
      - id: prettier-eslint
        name: prettier + eslint (web)
        entry: bash -c 'cd web && pnpm lint'
        language: system
        files: ^web/
        pass_filenames: false
